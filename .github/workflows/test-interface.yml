name: Web Interface Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ProntuarioMedico.Web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./ProntuarioMedico.Web
        run: npm ci
      
      - name: Install Playwright Browsers
        working-directory: ./ProntuarioMedico.Web
        run: npx playwright install --with-deps chromium
      
      - name: Start API Backend
        working-directory: ./ProntuarioMedico.Api
        run: |
          dotnet run --urls="http://localhost:5135" &
          echo $! > /tmp/api.pid
          # Wait for API to be ready
          timeout 60 bash -c 'until curl -s http://localhost:5135/api/pacientes > /dev/null; do sleep 1; done' || echo "API might not be ready"
      
      - name: Start Web Frontend
        working-directory: ./ProntuarioMedico.Web
        run: |
          python3 -m http.server 8080 &
          echo $! > /tmp/web.pid
          # Wait for web server to be ready
          sleep 3
      
      - name: Run Playwright Tests
        working-directory: ./ProntuarioMedico.Web
        run: npm test
      
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ProntuarioMedico.Web/playwright-report/
          retention-days: 30
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ProntuarioMedico.Web/test-results/
          retention-days: 30
      
      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/api.pid ] && kill $(cat /tmp/api.pid) || true
          [ -f /tmp/web.pid ] && kill $(cat /tmp/web.pid) || true
